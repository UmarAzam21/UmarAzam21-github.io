<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f4f8" stroke="#059669" stroke-width="2"/>
  
  <!-- Book shape -->
  <rect x="50" y="45" width="100" height="80" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  
  <!-- Book spine -->
  <line x1="100" y1="45" x2="100" y2="125" stroke="#047857" stroke-width="2"/>
  
  <!-- Pages lines (representing learning) -->
  <line x1="65" y1="60" x2="95" y2="60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="95" y2="75" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="90" x2="95" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="60" x2="135" y2="60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="75" x2="135" y2="75" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="90" x2="135" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Play button for video call -->
  <circle cx="100" cy="145" r="20" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <polygon points="95,138 95,152 110,145" fill="#ffffff"/>
  
  <!-- Text -->
  <text x="100" y="182" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#059669">CustomLearn</text>
</svg>